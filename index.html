<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="description" content="Photography and short-form video campaigns.">
<title>Photography and short-form campaigns</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,500;12..96,800&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#000; --raise:#0c0d0e; --ink:#f1f1ef; --muted:#8c9196; --line:#25282b; --ice:#bfe3ff;
  --display:'Bricolage Grotesque','Helvetica Neue',Arial,sans-serif;
  --text:'Newsreader',Georgia,serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(68px + env(safe-area-inset-top,0px));background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--text);font-size:19px;line-height:1.6}
a{color:inherit}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1;letter-spacing:-.03em}
:focus-visible{outline:2px solid var(--ice);outline-offset:3px}
.wrap{max-width:1280px;margin:0 auto;padding:0 clamp(16px,4vw,40px)}

header.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(0,0,0,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;height:64px;gap:16px}
.logo{font-family:var(--display);font-weight:800;font-size:20px;text-decoration:none;letter-spacing:-.04em}
.nav ul{display:flex;gap:28px;list-style:none;margin:0;padding:0}
.nav ul a{text-decoration:none;font-family:var(--display);font-size:15px;color:var(--muted)}
.nav ul a:hover{color:var(--ink)}
.btn{display:inline-block;font-family:var(--display);font-size:15px;font-weight:500;padding:12px 20px;background:var(--ink);color:#000;border:0;border-radius:2px;text-decoration:none;cursor:pointer}
.btn:hover{background:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid #3a3e42}
.btn.ghost:hover{border-color:var(--ink)}
@media(max-width:700px){.nav ul{display:none}}

.hero{padding:clamp(48px,8vw,104px) 0 clamp(40px,6vw,72px);border-bottom:1px solid var(--line)}
.hero .label{font-family:var(--display);font-size:clamp(16px,1.6vw,20px);color:var(--muted);margin:0 0 8px}
.reach{font-family:var(--display);font-weight:800;font-size:clamp(96px,26vw,400px);line-height:.82;letter-spacing:-.06em;margin:0;font-variant-numeric:tabular-nums}
.split{margin-top:clamp(28px,4vw,48px)}
.bar{display:flex;height:10px;gap:3px}
.bar i{display:block;background:#4a5056;transition:width 1.4s cubic-bezier(.2,.7,.2,1)}
.bar i:first-child{background:var(--ice)}
.bar i:nth-child(2){background:#8e989f}
.legend{display:flex;flex-wrap:wrap;gap:8px 32px;margin-top:12px;font-family:var(--display);font-size:14px;color:var(--muted)}
.legend b{color:var(--ink);font-weight:500;margin-left:6px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));margin-top:clamp(32px,5vw,64px);border-top:1px solid var(--line)}
.stats div{padding:20px 20px 0 0}
.stats div+div{padding-left:20px;border-left:1px solid var(--line)}
.stats b{display:block;font-family:var(--display);font-weight:800;font-size:clamp(44px,8vw,112px);line-height:1;letter-spacing:-.05em}
.stats span{font-family:var(--display);font-size:15px;color:var(--muted)}
.hero .intro{display:flex;flex-wrap:wrap;gap:20px 32px;align-items:center;justify-content:space-between;margin-top:clamp(28px,4vw,48px)}
.profile{display:flex;align-items:center;gap:clamp(16px,2.4vw,28px);margin-bottom:clamp(32px,5vw,56px)}
.pfp{flex:none;width:clamp(76px,9vw,120px);aspect-ratio:1;border-radius:50%;overflow:hidden;background:var(--raise);border:1px solid #3a3e42;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:clamp(30px,4vw,48px);color:#4a5056}
.pfp img{width:100%;height:100%;object-fit:cover;display:block}
.profile h1{font-size:clamp(28px,3.4vw,44px);font-weight:800}
.profile p{margin:8px 0 0;color:#b9bcbf;max-width:46ch;font-size:18px;line-height:1.4}
.profile p:empty{display:none}

section{padding:clamp(64px,9vw,112px) 0}
.sec-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:20px;margin-bottom:32px}
.sec-head h2{font-size:clamp(36px,5vw,68px);font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--display);font-size:14px;padding:8px 14px;border:1px solid #3a3e42;background:transparent;color:var(--ink);border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:#000;border-color:var(--ink)}

.vgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.vcard{margin:0;min-width:0}
.vcard[hidden]{display:none}
.vbox{position:relative;aspect-ratio:9/16;background:var(--raise);overflow:hidden;border:1px solid var(--line)}
.vbox img,.vbox iframe{position:absolute;inset:0;width:100%;height:100%;display:block;border:0;object-fit:cover}
.blank{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(160deg,#15181b,#050607);font-family:var(--display);font-weight:800;font-size:22px;color:#2c3237}
.play{position:absolute;inset:0;width:100%;height:100%;border:0;background:linear-gradient(to top,rgba(0,0,0,.65),transparent 45%);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
.play span{width:64px;height:64px;border-radius:50%;background:rgba(0,0,0,.55);border:1.5px solid rgba(255,255,255,.8);display:grid;place-items:center;transition:transform .2s}
.play:hover span{transform:scale(1.08)}
.play svg{width:22px;height:22px;margin-left:3px}
.tag{position:absolute;left:10px;top:10px;z-index:2;font-family:var(--display);font-size:12px;padding:4px 9px;background:rgba(0,0,0,.7);border:1px solid #3a3e42;border-radius:999px}
.vmeta{display:flex;justify-content:space-between;gap:12px;padding-top:10px;font-family:var(--display);font-size:14px}
.vmeta span{color:var(--muted)}
.vmeta a{color:var(--ice);text-decoration:none;white-space:nowrap}
.vmeta a:hover{text-decoration:underline}
@media(max-width:1000px){.vgrid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.vgrid{gap:10px}}

.pgrid{columns:4 220px;column-gap:16px}
.pitem{break-inside:avoid;margin:0 0 16px;display:block;width:100%;padding:0;border:0;background:var(--raise);cursor:pointer;position:relative;overflow:hidden}
.pitem svg,.pitem img{display:block;width:100%;height:100%;position:absolute;inset:0;object-fit:cover;transition:transform .5s}
.pitem:hover svg,.pitem:hover img{transform:scale(1.03)}
dialog{border:0;padding:0;background:#000;color:var(--ink);max-width:min(980px,94vw);max-height:92vh;width:100%;box-shadow:0 0 0 1px var(--line)}
dialog::backdrop{background:rgba(0,0,0,.88)}
.lbimg{position:relative;width:100%;aspect-ratio:4/5;max-height:80vh;background:var(--raise)}
.lbimg svg,.lbimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.lbbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;font-family:var(--display);font-size:14px;color:var(--muted)}
.lbbar button{font:inherit;color:var(--ink);background:none;border:1px solid #3a3e42;border-radius:999px;padding:6px 14px;cursor:pointer}

.contact{border-top:1px solid var(--line)}
.contact .big{font-family:var(--display);font-weight:800;font-size:clamp(40px,8vw,120px);letter-spacing:-.05em;line-height:.95;margin:0 0 32px;max-width:14ch}
.contact .links{display:flex;flex-wrap:wrap;gap:12px}
footer{padding:24px 0 40px;font-family:var(--display);font-size:14px;color:var(--muted);border-top:1px solid var(--line)}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.bar i,.pitem svg,.pitem img{transition:none}}
</style>
</head>
<body>

<header class="nav">
  <div class="wrap">
    <a class="logo" href="#top" id="brandName">&nbsp;</a>
    <nav aria-label="Main"><ul>
      <li><a href="#videos">Videos</a></li>
      <li><a href="#photos">Photos</a></li>
    </ul></nav>
    <a class="btn" href="#contact">Work with us</a>
  </div>
</header>

<main id="top">
<div class="hero">
  <div class="wrap">
    <div class="profile">
      <div class="pfp" id="pfp" aria-hidden="false"></div>
      <div>
        <h1 id="profName"></h1>
        <p id="introText"></p>
      </div>
    </div>
    <p class="label">Total reach across all campaigns</p>
    <p class="reach" id="reachNum">0</p>
    <div class="split">
      <div class="bar" id="bar" role="img" aria-label="Reach by platform"></div>
      <div class="legend" id="legend"></div>
    </div>
    <div class="stats" id="stats"></div>
    <div class="intro">
      <a class="btn ghost" href="#videos">Watch the latest</a>
    </div>
  </div>
</div>

<section id="videos">
  <div class="wrap">
    <div class="sec-head">
      <h2>Short-form video</h2>
      <div class="chips" id="vfilters" role="group" aria-label="Filter by platform"></div>
    </div>
    <div class="vgrid" id="vgrid"></div>
  </div>
</section>

<section id="photos" style="padding-top:0">
  <div class="wrap">
    <div class="sec-head"><h2>Photography</h2></div>
    <div class="pgrid" id="pgrid"></div>
  </div>
</section>

<section id="contact" class="contact">
  <div class="wrap">
    <p class="big">Have a campaign in mind?</p>
    <div class="links" id="links"></div>
  </div>
</section>
</main>

<footer><div class="wrap"><span id="foot"></span><span id="foot2">Reach figures are cumulative across platforms.</span></div></footer>

<dialog id="lb" aria-label="Photo viewer">
  <div class="lbimg" id="lbImg"></div>
  <div class="lbbar"><span id="lbCap"></span><span><button id="lbPrev" type="button">Previous</button> <button id="lbNext" type="button">Next</button> <button id="lbClose" type="button">Close</button></span></div>
</dialog>

<script>
/* =====================================================================
   1. Your Sanity project ID and dataset. If projectId is empty, the page
      shows demo content instead.
   ===================================================================== */
const SANITY = { projectId: 'gi6q4yr8', dataset: 'portfolio', apiVersion: '2025-01-01' };

/* One request fetches everything the page needs. */
const QUERY = `{
  "settings": *[_type=="siteSettings"][0]{brand,intro,email,socials,reachByPlatform,stats,"pfp":profileImage.asset->url},
  "videos": *[_type=="video"]|order(order asc,_createdAt desc){title,platform,url,views,"poster":poster.asset->url},
  "photos": *[_type=="photo"]|order(order asc,_createdAt desc){alt,"src":image.asset->url,"w":image.asset->metadata.dimensions.width,"h":image.asset->metadata.dimensions.height}
}`;

/* Demo content, shown when no project ID is set or Sanity can't be reached. */
const DEMO = {
  demo: true,
  settings: {
    brand: 'Your name',
    intro: 'Photography and short-form video for brands that want to be seen.',
    email: 'hello@example.com',
    socials: [{label:'Instagram',url:'#'},{label:'TikTok',url:'#'},{label:'YouTube',url:'#'}],
    reachByPlatform: [{platform:'Instagram',reach:21400000},{platform:'TikTok',reach:17900000},{platform:'YouTube',reach:8900000}],
    stats: [{value:63,label:'Campaigns delivered'},{value:27,label:'Brands'},{value:6,label:'Years active'}]
  },
  videos: [
    {title:'Summer trail launch',platform:'Instagram',views:'2.1M views',url:''},
    {title:'Studio behind the scenes',platform:'TikTok',views:'4.8M views',url:''},
    {title:'City night walk',platform:'YouTube',views:'1.3M views',url:''},
    {title:'Ceramics drop',platform:'Instagram',views:'890K views',url:''}
  ],
  photos: [
    {alt:'Dunes at sunrise',scene:'dunes',w:4,h:5},
    {alt:'Glass facade at dusk',scene:'facade',w:3,h:4},
    {alt:'Stair hall',scene:'stairs',w:4,h:5},
    {alt:'Pines in fog',scene:'forest',w:1,h:1}
  ]
};

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = u => /^https?:\/\//i.test(u || '') ? u : '#';
const fmt = n => n>=1e9 ? (n/1e9).toFixed(1)+'B' : n>=1e6 ? (n/1e6).toFixed(1)+'M' : n>=1e3 ? Math.round(n/1e3)+'K' : String(Math.round(n));
const square = (src, n) => src && src.includes('cdn.sanity.io') ? `${src}?w=${n}&h=${n}&fit=crop&auto=format` : src;
const sized = (src, w) => src && src.includes('cdn.sanity.io') ? `${src}?w=${w}&auto=format` : src;

const SCENES = {
 dunes:'<svg viewBox="0 0 400 500" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="a1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3d7b6"/><stop offset="1" stop-color="#e9a877"/></linearGradient></defs><rect width="400" height="500" fill="url(#a1)"/><circle cx="290" cy="130" r="38" fill="#fff6e6"/><path d="M0 300C90 240 170 250 260 300S360 330 400 290V500H0Z" fill="#c9773f"/><path d="M0 380C120 310 220 340 400 360V500H0Z" fill="#a95a2a"/></svg>',
 facade:(()=>{let w='';for(let r=0;r<9;r++)for(let c=0;c<6;c++){const on=(r*7+c*3)%5===0;w+=`<rect x="${30+c*60}" y="${40+r*50}" width="38" height="34" fill="${on?'#f3c56b':'#173b57'}"/>`}return`<svg viewBox="0 0 400 500" preserveAspectRatio="xMidYMid slice"><rect width="400" height="500" fill="#4c7a99"/>${w}</svg>`})(),
 stairs:(()=>{let s='';for(let i=0;i<9;i++)s+=`<path d="M${-20+i*45} ${500-i*50}H420V${450-i*50}H${-20+i*45}Z" fill="${i%2?'#dfe6ea':'#b7c4cc'}"/>`;return`<svg viewBox="0 0 400 500" preserveAspectRatio="xMidYMid slice"><rect width="400" height="500" fill="#8fa2ae"/>${s}</svg>`})(),
 forest:(()=>{let t='';for(let i=0;i<14;i++){const x=(i*37+13)%400,w=6+(i%4)*5;t+=`<rect x="${x}" y="0" width="${w}" height="500" fill="#1f2f2a" opacity="${.35+(i%5)*.13}"/>`}return`<svg viewBox="0 0 400 500" preserveAspectRatio="xMidYMid slice"><rect width="400" height="500" fill="#8ea69c"/>${t}</svg>`})()
};
const photoMedia = (p, w) => p.src ? `<img src="${esc(sized(p.src,w))}" alt="${esc(p.alt)}" loading="lazy">` : (SCENES[p.scene] || '');

function embedUrl(u){
  let m;
  if((m=u.match(/youtube\.com\/shorts\/([\w-]+)/)||u.match(/youtu\.be\/([\w-]+)/)||u.match(/[?&]v=([\w-]+)/)))
    return 'https://www.youtube.com/embed/'+m[1]+'?autoplay=1&playsinline=1&rel=0';
  if((m=u.match(/instagram\.com\/(?:reel|reels|p)\/([\w-]+)/)))
    return 'https://www.instagram.com/reel/'+m[1]+'/embed';
  if((m=u.match(/tiktok\.com\/.*\/video\/(\d+)/)))
    return 'https://www.tiktok.com/embed/v2/'+m[1];
  return null;
}
const playIcon = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l14 8-14 8z"/></svg>';

/* ---------- load ---------- */
async function load(){
  if(!SANITY.projectId) return DEMO;
  const url = `https://${SANITY.projectId}.apicdn.sanity.io/v${SANITY.apiVersion}/data/query/${SANITY.dataset}?query=${encodeURIComponent(QUERY)}`;
  try{
    const r = await fetch(url);
    if(!r.ok) throw new Error('HTTP '+r.status);
    const j = await r.json();
    return j.result;
  }catch(e){
    console.warn('Could not load from Sanity, showing demo content.', e);
    return DEMO;
  }
}

/* ---------- render ---------- */
function render(d){
  const s = d.settings || {};
  const brand = s.brand || 'Your name';
  $('#brandName').textContent = brand;
  document.title = brand + ' | Photography and short-form campaigns';
  $('#introText').textContent = s.intro || '';
  $('#profName').textContent = brand;
  $('#pfp').innerHTML = s.pfp
    ? `<img src="${esc(square(s.pfp,360))}" alt="Portrait of ${esc(brand)}">`
    : esc(brand.trim().charAt(0).toUpperCase());
  $('#foot').textContent = '© ' + new Date().getFullYear() + ' ' + brand;
  if(d.demo) $('#foot2').textContent = 'Demo content. Add your Sanity project ID in index.html.';

  const socials = (s.socials || []).filter(x => x && x.url);
  $('#links').innerHTML =
    (s.email ? `<a class="btn" href="mailto:${esc(s.email)}">${esc(s.email)}</a>` : '') +
    socials.map(x => `<a class="btn ghost" href="${esc(safeUrl(x.url))}" target="_blank" rel="noopener">${esc(x.label)}</a>`).join('');

  /* reach */
  const rp = (s.reachByPlatform || []).filter(r => r && r.reach > 0);
  const total = rp.reduce((a,r) => a + r.reach, 0);
  $('#legend').innerHTML = rp.map(r => `<span>${esc(r.platform)}<b>${fmt(r.reach)}</b></span>`).join('');
  $('#bar').innerHTML = rp.map(r => `<i style="width:0" data-w="${(r.reach/total*100).toFixed(2)}%" title="${esc(r.platform)}"></i>`).join('');
  $('#stats').innerHTML = (s.stats || []).map(x => `<div><b data-n="${Number(x.value)||0}">0</b><span>${esc(x.label)}</span></div>`).join('');
  animate(total);

  /* videos: shown 12 at a time, with a "Show more" button */
  const vgrid = $('#vgrid');
  const videos = d.videos || [];
  $('#videos').hidden = !videos.length;
  const PAGE = 12;
  let shown = PAGE, platform = 'All';
  const more = document.createElement('div');
  more.style.cssText = 'display:flex;justify-content:center;margin-top:32px';
  more.innerHTML = '<button class="btn ghost" type="button" id="vmore"></button>';
  vgrid.after(more);
  function card(v){
    const src = v.url ? embedUrl(v.url) : null;
    const el = document.createElement('figure');
    el.className = 'vcard';
    /* Thumbnail: use the image stored in Sanity if there is one. Otherwise, for
       Instagram, try Instagram's own thumbnail address (unofficial, so it may fail);
       if it fails the plain tile underneath stays visible. */
    const ig = v.url && v.url.match(/instagram\.com\/(?:reel|reels|p)\/([\w-]+)/);
    const art = v.poster
      ? `<div class="blank">${esc(v.platform)}</div><img src="${esc(sized(v.poster,600))}" alt="" loading="lazy">`
      : `<div class="blank">${esc(v.platform)}</div>` + (ig ? `<img data-ig src="https://www.instagram.com/p/${ig[1]}/media/?size=l" referrerpolicy="no-referrer" alt="" loading="lazy">` : '');
    el.innerHTML = `<div class="vbox"><span class="tag">${esc(v.platform)}</span>${art}${src ? `<button class="play" type="button" aria-label="Play ${esc(v.title)}"><span>${playIcon}</span></button>` : ''}</div>
      <figcaption class="vmeta"><div><span dir="auto" style="color:var(--ink);display:block">${esc(v.title)}</span><span>${src ? esc(v.views || '') : 'Add a valid share link'}</span></div>${v.url ? `<a href="${esc(safeUrl(v.url))}" target="_blank" rel="noopener">Open on ${esc(v.platform)}</a>` : ''}</figcaption>`;
    const igImg = el.querySelector('img[data-ig]');
    if(igImg) igImg.addEventListener('error', () => igImg.remove());
    if(src){
      const btn = el.querySelector('.play');
      btn.onclick = () => {
        const f = document.createElement('iframe');
        f.src = src; f.title = v.title;
        f.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
        f.allowFullscreen = true; f.loading = 'lazy';
        el.querySelector('.vbox').appendChild(f); btn.remove();
      };
    }
    return el;
  }
  function paintVideos(){
    const list = videos.filter(v => platform === 'All' || v.platform === platform);
    vgrid.innerHTML = '';
    list.slice(0, shown).forEach(v => vgrid.appendChild(card(v)));
    const left = list.length - shown;
    more.style.display = left > 0 ? 'flex' : 'none';
    $('#vmore').textContent = `Show more (${Math.max(left,0)} left)`;
  }
  $('#vmore').onclick = () => { shown += PAGE; paintVideos(); };
  const plats = ['All', ...new Set(videos.map(v => v.platform))];
  $('#vfilters').innerHTML = plats.length > 2 ? plats.map((p,i) => `<button class="chip" type="button" data-p="${esc(p)}" aria-pressed="${i===0}">${esc(p)}</button>`).join('') : '';
  document.querySelectorAll('#vfilters .chip').forEach(c => c.onclick = () => {
    document.querySelectorAll('#vfilters .chip').forEach(x => x.setAttribute('aria-pressed', x === c));
    platform = c.dataset.p; shown = PAGE; paintVideos();
  });
  paintVideos();

  /* photos + viewer */
  const photos = d.photos || [];
  $('#photos').hidden = !photos.length;
  $('#pgrid').innerHTML = photos.map((p,i) =>
    `<button class="pitem" type="button" data-i="${i}" style="aspect-ratio:${p.w && p.h ? p.w+'/'+p.h : '4/5'}" aria-label="Open photo: ${esc(p.alt)}">${photoMedia(p,900)}</button>`).join('');
  const lb = $('#lb'); let cur = 0;
  const show = i => {
    cur = (i + photos.length) % photos.length;
    $('#lbImg').innerHTML = photoMedia(photos[cur], 2000);
    $('#lbCap').textContent = photos[cur].alt + '  (' + (cur+1) + '/' + photos.length + ')';
  };
  document.querySelectorAll('.pitem').forEach(b => b.onclick = () => { show(+b.dataset.i); lb.showModal(); });
  $('#lbPrev').onclick = () => show(cur-1);
  $('#lbNext').onclick = () => show(cur+1);
  $('#lbClose').onclick = () => lb.close();
  lb.onclick = e => { if(e.target === lb) lb.close(); };
  lb.onkeydown = e => { if(e.key === 'ArrowRight') show(cur+1); if(e.key === 'ArrowLeft') show(cur-1); };
}

/* The one page-load moment: numbers count up and the bar fills. */
function animate(total){
  const reachEl = $('#reachNum'), nums = [...document.querySelectorAll('[data-n]')];
  const bars = [...document.querySelectorAll('#bar i')];
  const finish = () => { reachEl.textContent = fmt(total); nums.forEach(n => n.textContent = n.dataset.n); bars.forEach(i => i.style.width = i.dataset.w); };
  if(matchMedia('(prefers-reduced-motion:reduce)').matches){ finish(); return; }
  const t0 = performance.now(), D = 1800;
  requestAnimationFrame(() => bars.forEach(i => i.style.width = i.dataset.w));
  (function tick(now){
    const p = Math.min(1, (now - t0) / D), e = 1 - Math.pow(1 - p, 4);
    reachEl.textContent = fmt(total * e);
    nums.forEach(n => n.textContent = Math.round(n.dataset.n * e));
    if(p < 1) requestAnimationFrame(tick); else finish();
  })(t0);
}

load().then(render);
</script>
